<style>

 --g0:#12363a;--g1:#47281f;--g2:#1c3a30;--g3:#2a2650;--soft:#112d31;--field:#183d43;--pret-bg:#43230f;--pret-ink:#f4a261}

:root[data-charte=azur]{--bg:#f7f9fc;--ink:#0f2740;--mute:#4f6682;--line:#d9e2ec;--acc:#1f6fd1;--acc2:#e8f1fc;--g0:#e8f1fc;--g1:#fbe9e9;--g2:#e4f3ea;--g3:#fbf1d8;--soft:#edf3fa;--field:#e1eaf5}

:root[data-charte=indigo]{--bg:#f7f7fd;--ink:#17163a;--mute:#5e5c82;--line:#e4e3f4;--acc:#4338ca;--acc2:#ecebfb;--g0:#ecebfb;--g1:#fbe9f0;--g2:#e3f2ea;--g3:#fdefd9;--soft:#eeeefa;--field:#e4e5f6}

*{box-sizing:border-box}
body{overflow-wrap:anywhere}
p,li,.desc,.meta{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.item .meta:not(.desc),.tb .meta,.kpi span,.bar,.base,.toast,.thumb,.gh .meta,.node .meta{text-align:left;hyphens:manual}
.tb th,.tb td,.btn{overflow-wrap:normal}
.node>span:last-child,.pr>span,.gh>.node{min-width:0}
body{margin:0;font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:88px}
body.busy::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:bz 1s linear infinite}
@keyframes bz{from{background-position:-50% 0}to{background-position:150% 0}}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:6px}
header h1{font-size:15.5px;white-space:nowrap;font-weight:800;letter-spacing:-.02em;margin:0;flex:1;line-height:1.1;min-width:0;display:flex;align-items:center;gap:8px}
header h1 svg{width:28px;height:28px;flex:none}
header h1 .nm{min-width:0;overflow:hidden}
header h1 .o{color:var(--acc)}
header .base{font-size:12px;color:var(--mute);display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
@media(max-width:400px){header h1{font-size:14px;gap:6px}header h1 svg{width:24px;height:24px}.sw{width:22px;height:22px}header .btn{padding:6px 8px!important}}
main{max-width:960px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:6px 0;font-size:9.5px;min-width:0;cursor:pointer;line-height:1.1}
nav button b{display:grid;place-items:center;height:24px;margin-bottom:2px}
nav button .ic{width:22px;height:22px}
nav button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{font-size:28px;color:var(--acc);display:block}.kpi span{color:var(--mute);font-size:13px}
h2{font-size:16px;margin:4px 0 10px}

.bar span:first-child{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 8px;border-radius:8px}
input,select,textarea,.pickbtn{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:70px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.btn{font:inherit;cursor:pointer;display:inline-block;text-align:center;padding:10px 14px;border-radius:10px;background:var(--acc);color:var(--acc-ink);border:0;font-weight:600}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:18px;z-index:70;font-size:14px;max-width:90%;text-align:center}

.pickbtn{text-align:left;cursor:pointer;min-height:44px}

details summary{cursor:pointer;font-weight:600;padding:6px 0}
main.soft .card,main.soft .kpi{background:var(--soft)}
main.soft input,main.soft select,main.soft textarea{background:var(--field);border-color:transparent}

.tools{display:flex;gap:6px;flex-wrap:wrap;width:100%}

.tbw{overflow-x:auto}table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:left;color:var(--mute);font-weight:600;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
.tb td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}.tb tr.r{cursor:pointer}.tb tr.r:hover{background:var(--acc2)}

.banner{background:var(--g3);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

<script>
/* Filet de sécurité : toute erreur s'affiche à l'écran (au lieu d'une page vierge) avec un bouton de remise à zéro */
function resetLocal() {
  try { Object.keys(localStorage).filter(k => k.indexOf('dmoc:') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) { }
  location.reload();
}
function showFatal(m) {
  const v = document.getElementById('view'); if (!v) return;
  v.className = '';
  v.innerHTML = '<div class="card"><h2><svg class="ic sm" aria-hidden="true"><use href="#i-alert"/></svg> Un problème est survenu</h2><p style="word-break:break-word">' + String(m).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])) + '</p><div class="row"><button class="btn" onclick="location.reload()">Recharger</button><button class="btn sec" onclick="resetLocal()">Effacer les données du téléphone et recharger</button></div></div>';
}
window.addEventListener('error', e => {
  let extra = '';
  try {
    const L = document.documentElement.outerHTML.split('\n'), n = e.lineno || 0;
    extra = ' | colonne ' + (e.colno || '?') + ' | fichier ' + String(e.filename || '').slice(-40) + ' | AVANT: ' + (L[n - 2] || '').slice(0, 160) + ' | LIGNE: ' + (L[n - 1] || '').slice(Math.max(0, (e.colno || 1) - 80), (e.colno || 1) + 80) + ' | APRES: ' + (L[n] || '').slice(0, 160);
  } catch (x) { }
  let bad = '';
  try {
    const sc = [...document.scripts].map(x => x.text).sort((a, b) => b.length - a.length)[0] || '';
    const lines = sc.split('\n'); let chunks = [], cur = [];
    lines.forEach(l => { if (/^(async function|function|const|let|var|document|\$\()/.test(l) && cur.length) { chunks.push(cur); cur = []; } cur.push(l); });
    if (cur.length) chunks.push(cur);
    chunks.forEach(c => { try { new Function(c.join('\n')); } catch (x) { if (bad.length < 900) bad += ' || MORCEAU REFUSE (' + x.message + ') : ' + c.join('\n').slice(0, 450); } });
    bad = ' || script: ' + lines.length + ' lignes, ' + sc.length + ' caractères' + bad;
  } catch (x) { bad = ' || diag: ' + x.message; }
  showFatal((e.message || 'Erreur') + (e.lineno ? ' (ligne ' + e.lineno + ')' : '') + extra + bad);
});
window.addEventListener('unhandledrejection', e => { const m = String((e.reason && e.reason.message) || e.reason || ''); if (!/HTTP 0|NetworkError|Failed to fetch/i.test(m) && !document.querySelector('#view .card')) showFatal(m); });
</script>
<script>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okId = s => typeof s === 'string' && /^[\w-]{1,80}$/.test(s);
const okMini = u => typeof u === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const msg = e => String((e && e.message) || e || 'Erreur').replace(/^(Error|Exception):\s*/i, '');
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const d = n => { const x = new Date(); x.setDate(x.getDate() - n); return x.toISOString().slice(0, 10); };

const L = k => k === 'T' ? types : emps;
const N = (k, id) => L(k).find(x => x.id === id);
const kids = (k, id) => { const r = [id]; L(k).filter(x => x.p === id).forEach(c => r.push(...kids(k, c.id))); return r; };
const root = (k, id) => { let n = N(k, id), i = 0; while (n && n.p && i++ < 60) n = N(k, n.p); return n; };
const path = (k, id, skip) => { const n = N(k, id); if (!n) return ''; if (!n.p) return skip ? '' : n.nom; const up = path(k, n.p, skip); return up ? up + ' › ' + n.nom : n.nom; };

function row(i) {

function match(i, q) {
  const terms = norm(q).split(/\s+/).filter(Boolean);
  let hay = HAY.get(i);
  if (hay === undefined) { hay = norm([i.titre, i.desc, i.tags, i.pa, path('E', i.e), path('E', i.e2), path('T', i.t), path('T', i.t2)].join(' ')); HAY.set(i, hay); }
  return terms.every(t => hay.includes(t));
}

/* ===== MES INFOS = base filtrable ===== */
function mf() {
  const m = M, dir = m.dir === 'asc' ? 1 : -1;
  const key = i => m.sort === 'titre' ? i.titre.toLowerCase() : m.sort === 'achat' ? (i.da || '') : m.sort === 'type' ? path('T', i.t) : m.sort === 'lieu' ? path('E', i.e) : (i.dh || i.date);
  return items.filter(i => {
    if (m.q && !match(i, m.q)) return false;
    if (m.T.size && ![...m.T].some(id => has('T', id, i))) return false;
    if (m.E.size && ![...m.E].some(id => has('E', id, i))) return false;
    if (m.pret === '1' && !i.pret || m.pret === '0' && i.pret) return false;
    if (m.sens === '1' && !i.sens || m.sens === '0' && i.sens) return false;
    if (m.photo === '1' && !i.ph.length || m.photo === '0' && i.ph.length) return false;
    if (m.son === '1' && !i.au || m.son === '0' && i.au) return false;
    if (m.d1 && i.date < m.d1 || m.d2 && i.date > m.d2) return false;
    if (m.a1 && (!i.da || i.da < m.a1) || m.a2 && (!i.da || i.da > m.a2)) return false;
    return true;
  }).sort((a, b) => key(a) > key(b) ? dir : key(a) < key(b) ? -dir : 0);
}

}

async function togSens(id) {
  if (S.revealed[id]) { S.revealed[id] = false; delete S.sv[id]; return openDetail(id); }
  const v = await act(() => api('lireValeurSensible', S.base.id, id)); if (v === undefined) return;
  S.sv[id] = v; S.revealed[id] = true; openDetail(id);
}
async function playSon(id) {
  const i = items.find(x => x.id === id); if (!i || !i.au) return;
  const box = $('#sonBox'); if (box) box.textContent = 'Chargement du son…';
  const r = await act(() => api('lireSon', S.base.id, i.au));
  if (!box) return; box.textContent = '';
  const m = r && /^data:(audio\/[\w.+-]+)(?:;[\w=.+-]+)*;base64,([A-Za-z0-9+\/=]+)$/.exec(r.dataUrl);
  if (!m) { box.textContent = 'Son indisponible.'; return; }
  const bin = atob(m[2]), u8 = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
  const url = URL.createObjectURL(new Blob([u8], { type: m[1] }));
  const a = document.createElement('audio'); a.controls = true; a.src = url; a.style.width = '100%';
  a.onerror = () => {
    const p = document.createElement('div'); p.className = 'meta';
    p.textContent = 'Ce téléphone ne sait pas lire ce format de son (' + m[1] + ', ' + Math.round(u8.length / 1024) + ' Ko). Tu peux le télécharger et l\u2019ouvrir avec une autre application : ';
    const l = document.createElement('a'); l.href = url; l.download = 'son-' + id; l.textContent = 'télécharger le son';
    p.appendChild(l); box.textContent = ''; box.appendChild(p);
  };
  box.appendChild(a);
  a.play().catch(() => { });
}

const FULL = {};
let VW = null;
function openViewer(itemId, k) {
  const i = items.find(x => x.id === itemId); if (!i) return;
  VW = { list: i.ph.map(p => ({ id: p, cap: '' })), k };
  drawViewer();
}
function openViewerNodes(itemId, k) {
  const i = items.find(x => x.id === itemId); if (!i) return;
  VW = { list: placeList(i).map(n => ({ id: n.ph, cap: n.nom })), k };
  drawViewer();
}
async function drawViewer() {
  if (!VW) return;
  const cur = VW.list[VW.k], id = cur.id;
  $('#viewerRoot').innerHTML = `<div class="viewer"><div id="vwImg" style="color:#fff">⏳ Chargement de la photo…</div>${cur.cap ? `<div style="color:#fff;margin-top:8px"><b>${esc(cur.cap)}</b></div>` : ''}
   <div class="bar2">${VW.list.length > 1 ? '<button class="btn sec" onclick="vwGo(-1)">‹</button>' : ''}<span>${VW.k + 1} / ${VW.list.length}</span>${VW.list.length > 1 ? '<button class="btn sec" onclick="vwGo(1)">›</button>' : ''}<button class="btn" onclick="closeViewer()">Fermer</button></div></div>`;
  let u = FULL[id];
  if (!u) {
    const r = await act(() => api('lirePhoto', S.base.id, id));
    if (r && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(r.dataUrl)) { u = r.dataUrl; const ks = Object.keys(FULL); if (ks.length > 8) delete FULL[ks[0]]; FULL[id] = u; }
  }
  if (!VW || VW.list[VW.k].id !== id) return;
  const box = $('#vwImg'); if (!box) return;
  box.textContent = '';
  if (u) { const im = new Image(); im.src = u; box.appendChild(im); } else box.textContent = 'Photo indisponible';
}
function vwGo(n) { VW.k = (VW.k + n + VW.list.length) % VW.list.length; drawViewer(); }
function closeViewer() { VW = null; $('#viewerRoot').innerHTML = ''; }

let F = null;
function openForm(id, brouillon) {
  if (ro()) return toast('Base en lecture seule');
  const i = id ? items.find(x => x.id === id) : null;
  if (brouillon) {
    const ex = brouillon.editId ? items.find(x => x.id === brouillon.editId) : null;
    F = { ...brouillon.F, id: ex ? ex.id : uid(), neu: !ex, sv: '', svState: 'ok' };
    if (ex && F.sens && ex.sens) F.svState = 'loading';
  } else if (i) {
    F = { ...JSON.parse(JSON.stringify(i)), neu: false, sv: '', svState: i.sens ? 'loading' : 'ok' };
  } else {
    F = { id: uid(), titre: '', desc: '', t: '', t2: '', e: '', e2: '', tags: '', pret: false, pa: '', dp: d(0), sens: false, sv: '', svState: 'ok', da: '', df: '', ph: [], au: null, neu: true };
  }
  drawForm();
  if (F.svState === 'loading') loadSv(F);
}
async function loadSv(f) {
  try {
    const v = await api('lireValeurSensible', S.base.id, f.id);

function compress(file, max, q) {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = rej;
    r.onload = () => { const im = new Image(); im.onerror = rej;
      im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * s)); c.height = Math.max(1, Math.round(im.height * s)); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); };
      im.src = r.result; };
    r.readAsDataURL(file);
  });
}
async function addPhotos(files) {
  sync();

    if (!F) return;
    if (F.ph.length >= 12) { toast('12 photos maximum'); break; }
    try {
      const [grande, mini] = await Promise.all([compress(f, 900, 0.7), compress(f, 160, 0.6)]);
      const o = { mini, id: null, st: 'envoi' };
      F.ph.push(o); renderPhotos();
      o.p = api('envoyerPhoto', S.base.id, grande, mini)
        .then(r => { o.id = r.id; o.st = 'ok'; if (okMini(mini)) TH[r.id] = mini; })
        .catch(e => { o.st = 'err'; o.err = msg(e); toast('Photo non envoyée : ' + o.err, 4500); })
        .finally(() => { renderPhotos(); saveDraft(); });
    } catch (e) { toast('Photo illisible'); }
  }
}

  <div class="photos">${a ? `<div class="slot" ${e.nouv ? '' : `data-ph="${e.ph}"`}>${src ? `<img src="${src}">` : '…'}${e.nouv && e.nouv.st === 'envoi' ? '<div class="up">envoi…</div>' : ''}${e.nouv && e.nouv.st === 'err' ? '<div class="up">échec</div>' : ''}</div>` : '<span class="meta">Aucune photo</span>'}</div>
  <div class="row"><label class="btn sec" style="margin:0;font-size:15px;color:var(--acc)">${ic('photo', 'sm')} ${a ? 'Changer' : 'Ajouter'} la photo<input type="file" accept="image/\x2a" hidden onchange="enPhoto(this.files[0]);this.value=''"></label>${a ? '<button class="btn del" onclick="enRetirer()">Retirer la photo</button>' : ''}</div>
  <div class="row" style="margin-top:16px"><button class="btn sec" onclick="EN=null;closeM()">Annuler</button><button class="btn" id="enSave" onclick="enSave()">Enregistrer</button></div>`, true);
  needMinis();
}
function pickIc(v) { EN.nom = $('#en_nom').value; EN.ic = v; drawEdit(); }
function enRetirer() { EN.nom = $('#en_nom').value; EN.ic = $('#en_ic').value; EN.nouv = null; EN.retire = true; drawEdit(); }
async function enPhoto(f) {
  if (!f || !EN) return;
  const e = EN; e.nom = $('#en_nom').value; e.ic = $('#en_ic').value;
  try {
    const [grande, mini] = await Promise.all([compress(f, 900, 0.7), compress(f, 160, 0.6)]);
    const o = { mini, id: null, st: 'envoi' }; e.nouv = o; e.retire = false; drawEdit();
    o.p = api('envoyerPhoto', S.base.id, grande, mini).then(r => { o.id = r.id; o.st = 'ok'; }).catch(x => { o.st = 'err'; toast('Photo non envoyée : ' + msg(x), 4500); }).finally(() => { if (EN === e) drawEdit(); });
  } catch (x) { toast('Photo illisible'); }
}
async function enSave() {
  const e = EN; if (!e || e.saving) return;
  e.nom = $('#en_nom').value.trim(); e.ic = $('#en_ic').value.trim();
  if (!e.nom) return toast('Le nom est obligatoire');
  if (e.nouv && e.nouv.p) await e.nouv.p;
  if (e.nouv && e.nouv.st !== 'ok') return toast('La photo n’a pas été envoyée : réessaie ou retire-la', 4000);
  e.saving = true; const btn = $('#enSave'); if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }
  const fin = () => { e.saving = false; const b = $('#enSave'); if (b) { b.disabled = false; b.textContent = 'Enregistrer'; } };
  const n = N(e.k, e.id); let r;
  if (e.nom !== n.nom) { r = await act(() => api('renommerNoeud', S.base.id, e.k, e.id, e.nom)); if (!r) return fin(); n.nom = r.nom; }
  const ch = {};
  if (e.ic !== (n.ic || '')) ch.icone = e.ic;
  if (e.nouv) ch.photo = e.nouv.id; else if (e.retire) ch.photo = '';
  if (Object.keys(ch).length) {
    r = await act(() => api('definirNoeud', S.base.id, e.k, e.id, ch)); if (!r) return fin();
    n.ic = r.ic; n.ph = r.ph; if (e.nouv && okMini(e.nouv.mini)) TH[r.ph] = e.nouv.mini;
  }
  HAY = new WeakMap(); cacheSoon(); EN = null; closeM(); toast('Enregistré'); render();
}
function askDelNode(k, id) {
  const ks = kids(k, id), n = items.filter(i => has(k, id, i)).length;
  modal(`<h2>${ic('alert', 'sm')} Supprimer « ${esc(N(k, id).nom)} » ?</h2><p>${ks.length > 1 ? `Ses ${ks.length - 1} sous-entrée(s) seront supprimées aussi. ` : ''}${n ? `<b>${n} élément(s)</b> sont concernés : ils perdront ce classement (ils ne sont pas supprimés). ` : ''}<b>Suppression définitive.</b></p>
  <div class="row"><button class="btn sec" onclick="closeM()">Annuler</button><button class="btn del" onclick="delNode('${k}','${id}')">Supprimer</button></div>`);
}
async function delNode(k, id) {
  const r = await act(() => api('supprimerNoeud', S.base.id, k, id));
  closeM(); if (!r) return;
  M.T = new Set(); M.E = new Set();
  toast(r.declasses ? `${r.declasses} élément(s) déclassé(s)` : 'Supprimé');
  await recharger(true);
}

/* ====================================================================
 * Bases et partage
 * ==================================================================== */
function vBases() {
  const act1 = b => b.role === 'propriétaire' ? `<button class="btn sec" style="flex:none" onclick="event.stopPropagation();shareM('${b.id}')">Partager</button>` : `<button class="btn del" style="flex:none" onclick="event.stopPropagation();askForget('${b.id}')">${b.role ? 'Quitter' : 'Retirer'}</button>`;
  $('#view').innerHTML = `<div class="card"><h2>Mes bases de données</h2>
  ${S.bases.map(b => `<div class="item" onclick="switchBase('${b.id}')">
   <div class="thumb">${b.partage ? ic('users', 'lg') : ic('lock', 'lg')}</div><div style="flex:1;min-width:0"><b>${esc(b.nom)}</b> ${S.base && S.base.id === b.id ? ic('check', 'sm') : ''}
   <div class="meta">${b.erreur ? ic('alert', 'sm') + ' ' + esc(b.erreur) : (b.role === 'propriétaire' ? (b.partage ? 'Partagée' : 'Privée — personne d’autre n’y a accès') : 'Base partagée avec toi') + ' · rôle : ' + esc(b.role)}</div></div>${act1(b)}</div>`).join('') || '<p class="meta">Aucune base.</p>'}
  <div class="row" style="margin-top:12px"><button class="btn" onclick="newBase()">${ic('plus', 'sm')} Créer une base</button><button class="btn sec" onclick="joinM()">Rejoindre une base</button></div></div>
  <div class="card meta">Connecté en tant que <b>${esc(S.email)}</b>.<br><button class="btn sec" style="margin:6px 0" onclick="resetLocal()">${ic('refresh', 'sm')} Effacer les données gardées sur ce téléphone</button><br>Pour inviter quelqu'un : « Partager » (adresse Gmail + droits), puis envoie-lui le lien d'invitation.${S.base && S.base.role === 'propriétaire' ? `<br><br><button class="btn sec" onclick="cleanMedias()">${ic('trash', 'sm')} Nettoyer les fichiers inutilisés de « ${esc(S.base.nom)} »</button>` : ''}</div>`;
}
async function retry() { S.error = ''; S.loaded = false; render(); try { setBase(await api('chargerBase', S.base ? S.base.id : (LS.get('dmoc:prefs') || {}).baseActive)); } catch (e) { S.error = msg(e); render(); } }
async function switchBase(id) {
  if (S.base && S.base.id === id && S.loaded) { S.view = 'home'; return render(); }
  const b = S.bases.find(x => x.id === id); if (!b || !b.role) return toast('Cette base est inaccessible');
  S.loaded = false; S.error = ''; S.base = { id, nom: b.nom, role: b.role }; S.view = 'home'; M = M0(); H = { q: '', done: false }; S.revealed = {}; S.sv = {};
  const c = LS.get('dmoc:b:' + id); if (c) { applyData(c); S.loaded = true; }
  render();
  try { setBase(await api('chargerBase', id)); } catch (e) { if (!S.loaded) { S.error = msg(e); render(); } else toast('Hors connexion : données du téléphone', 3500); }
}
async function recharger(silencieux) {
  if (!S.base) return;
  try { const dt = await api('chargerBase', S.base.id); const open = $('#modalRoot').innerHTML; setBase(dt); if (!silencieux) toast('À jour'); void open; }
  catch (e) { if (!silencieux) toast(msg(e), 3500); }
}
function newBase() { nameM('Nom de la nouvelle base', '', async v => { const b = await act(() => api('creerBase', v)); if (b) { S.bases.push(b); toast('Base créée'); switchBase(b.id); } }); }
function joinM() {
  modal(`<h2>Rejoindre une base</h2><p class="meta">Colle ici le lien d'invitation reçu. Il faut que la personne ait d'abord partagé la base avec ton adresse Gmail.</p><input id="jl" placeholder="Colle ici le lien reçu">
  <div class="row" style="margin-top:12px"><button class="btn sec" onclick="closeM()">Annuler</button><button class="btn" onclick="joinOk()">Rejoindre</button></div>`);
}
async function joinOk() {
  const v = $('#jl').value.trim(); if (!v) return;
  const b = await act(() => api('rejoindreBase', v)); if (!b) return;
  closeM(); const k = S.bases.findIndex(x => x.id === b.id); if (k >= 0) S.bases[k] = b; else S.bases.push(b);
  toast('Base ajoutée'); switchBase(b.id);
}
function askForget(id) {
  const b = S.bases.find(x => x.id === id);
  modal(`<h2>Retirer « ${esc(b.nom)} » de ta liste ?</h2><p>Rien n'est supprimé dans Drive : tu pourras la rejoindre de nouveau avec le lien d'invitation si le propriétaire t'a toujours donné accès.</p>
  <div class="row"><button class="btn sec" onclick="closeM()">Annuler</button><button class="btn del" onclick="forget('${id}')">Retirer</button></div>`);
}
async function forget(id) {
  const r = await act(() => api('oublierBase', id)); closeM(); if (!r) return;
  S.bases = S.bases.filter(b => b.id !== id); LS.del('dmoc:b:' + id);
  if (S.base && S.base.id === id) { const n = S.bases.find(b => b.role); S.base = null; S.loaded = false; if (n) return switchBase(n.id); }
  render();
}
async function cleanMedias() {
  const r = await act(() => api('nettoyerMedias', S.base.id)); if (r) toast(r.corbeille ? r.corbeille + ' fichier(s) inutilisé(s) mis à la corbeille' : 'Rien à nettoyer');
}
let SH = null;
async function shareM(id) {
  const b = S.bases.find(x => x.id === id); SH = { id, mem: [], lien: '' };
  modal(`<h2>Partager « ${esc(b.nom)} »</h2><div id="shBody"><p class="meta">Chargement…</p></div>`);
  const mem = await act(() => api('listerMembres', id)); if (mem === undefined) return closeM();
  SH.mem = mem; drawShare();
}
function drawShare() {
  const b = $('#shBody'); if (!b || !SH) return;
  b.innerHTML = `${SH.mem.length ? SH.mem.map((m, k) => `<div class="item" style="cursor:default"><div style="flex:1;min-width:0"><b>${esc(m.email)}</b><div class="meta">${esc(m.role)}</div></div><button class="btn del" onclick="retirer(${k})">Retirer</button></div>`).join('') : '<p class="meta">Personne d’autre n’a accès à cette base.</p>'}
  <label>Adresse Gmail de la personne</label><input id="sm" type="email" placeholder="prenom@gmail.com" autocomplete="off">
  <label>Droits</label><select id="sr"><option value="modification">modification (peut ajouter et modifier)</option><option value="lecture">lecture seule</option></select>
  <div class="row" style="margin-top:12px"><button class="btn sec" onclick="closeM()">Fermer</button><button class="btn" onclick="doShare()">Partager</button></div>
  <div class="meta" style="margin-top:8px">Google envoie un e-mail à la personne. Elle doit ensuite ouvrir le lien d'invitation avec ce même compte Gmail.</div>
  <div class="card" style="margin-top:12px"><b>Lien d'invitation</b>${SH.lien ? `<div class="linkbox">${esc(SH.lien)}</div><div class="row"><button class="btn sec" onclick="copyLink()">Copier</button><button class="btn sec" onclick="shareLink()">Envoyer…</button></div>` : `<div><button class="btn sec" style="margin-top:6px" onclick="showLink()">Afficher le lien</button></div>`}</div>`;
}
async function doShare() {
  const m = $('#sm').value.trim(); if (!m.includes('@')) return toast('E-mail invalide');
  const r = await act(() => api('partagerBase', SH.id, m, $('#sr').value)); if (!r) return;
  toast(r.mailPerso ? 'Partagé avec ' + r.email + ' : e-mail envoyé avec le lien et les explications' : 'Partagé avec ' + r.email + ' : envoie-lui aussi le lien d\u2019invitation ci-dessous', 5000);
  const b = S.bases.find(x => x.id === SH.id); if (b) b.partage = true;
  const mem = await act(() => api('listerMembres', SH.id)); if (mem) SH.mem = mem;
  await showLink();
}
async function retirer(k) {
  const m = SH.mem[k]; if (!m) return;
  const r = await act(() => api('retirerMembre', SH.id, m.email)); if (!r) return;
  SH.mem.splice(k, 1); const b = S.bases.find(x => x.id === SH.id); if (b) b.partage = SH.mem.length > 0; toast('Accès retiré'); drawShare();
}
async function showLink() { const l = await act(() => api('lienInvitation', SH.id)); if (l) { SH.lien = l; drawShare(); } }
function copyLink() {
  const l = SH.lien;
  const fin = ok => toast(ok ? 'Lien copié' : 'Copie impossible : appuie longuement sur le lien pour le copier', 3500);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(l).then(() => fin(true), () => fin(false)); else fin(false);
}
function shareLink() {
  const l = SH.lien;
  if (navigator.share) navigator.share({ title: "Dis moi où c'est !", text: 'Voici le lien pour rejoindre ma base :', url: l }).catch(() => { });
  else copyLink();
}

/* ====================================================================
 * Démarrage
 * ==================================================================== */
async function start() {
  applyTheme(); render();
  const lp = LS.get('dmoc:prefs') || {}; const pre = okId(lp.baseActive) ? lp.baseActive : '';
  if (pre && !INVITE) {                                   // affichage immédiat avec les dernières données connues
    const c = LS.get('dmoc:b:' + pre);
    if (c && c.base) { applyData(c); S.base = c.base; S.loaded = true; render(); autoDraft(); }
  }
  const pData = pre && !INVITE ? api('chargerBase', pre).catch(() => null) : null;   // en parallèle de « démarrer »
  let dm;
  try { dm = await api('demarrer', INVITE); }
  catch (e) { if (S.loaded) { toast('Hors connexion : données du téléphone', 4000); return; } S.error = msg(e); render(); return; }
  S.email = dm.email; S.bases = dm.bases;
  if (dm.prefs) { if (dm.prefs.theme) S.theme = dm.prefs.theme; if (dm.prefs.charte) S.charte = dm.prefs.charte; LS.set('dmoc:prefs', { theme: S.theme, charte: S.charte, baseActive: dm.baseActive }); applyTheme(); }
  if (dm.message) toast(dm.message, 5000);
  if (!dm.baseActive) { S.view = 'bases'; S.loaded = false; render(); return; }
  let dt = null;
  if (pData && dm.baseActive === pre) dt = await pData;
  if (!dt) { try { dt = await api('chargerBase', dm.baseActive); } catch (e) { if (!S.loaded) { S.error = msg(e); S.base = { id: dm.baseActive, nom: '', role: '' }; render(); } return; } }
  setBase(dt);
  autoDraft();
}
/* Après un rechargement (typique au retour de l'appareil photo sous Android) : on rouvre le formulaire en cours */
function autoDraft() {
  const dr = LS.get('dmoc:draft');
  if (dr && S.base && dr.base === S.base.id && !ro() && dr.F && Date.now() - dr.t < 15 * 60 * 1000) { openForm(null, dr); toast('Brouillon repris — la photo prise n’a pas pu être récupérée, ajoute-la de nouveau', 6000); }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { saveDraft(); return; }
  if (S.loaded && Date.now() - S.tLoad > 120000 && !$('#modalRoot').innerHTML && !$('#viewerRoot').innerHTML) recharger(true);
});
start();
</script>
</body>
